version: '3.8'

services:
  # Serviço PHP/Apache
  php:
    build: .
    container_name: socialmusic_backend
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      # Variáveis de ambiente (podem ser sobrescritas pelo .env)
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-sistema_auth}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-root}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
    depends_on:
      - mysql
    networks:
      - socialmusic_network

  # Serviço MySQL
  mysql:
    image: mysql:8.0
    container_name: socialmusic_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-sistema_auth}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - socialmusic_network

volumes:
  mysql_data:

networks:
  socialmusic_network:
    driver: bridge
